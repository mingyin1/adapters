# Copies the result tables and Harbor's result.json from a "TavernBench oracle" run
# into this branch, so they can be linked from the adapter PR without downloading
# the artifacts. Lives only on the fork's `oracle-results` branch.
#
# To publish a run: write its run id to results/ORACLE_RUN_ID and push. To publish
# again (for example after another job of the run has finished), change
# results/PUBLISH_REQUEST and push.
name: Publish TavernBench oracle results

on:
  push:
    branches: [oracle-results]
    paths:
      - results/ORACLE_RUN_ID
      - results/PUBLISH_REQUEST
      - .github/workflows/publish-oracle-results.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-oracle-results
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this branch
        uses: actions/checkout@v4

      - name: Read the run id
        id: run
        run: echo "id=$(tr -dc '0-9' < results/ORACLE_RUN_ID)" >> "$GITHUB_OUTPUT"

      - name: Download the artifacts of that run
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ steps.run.outputs.id }}
          github-token: ${{ github.token }}
          path: artifacts

      - name: Copy the result tables and result files
        run: |
          set -euo pipefail
          find artifacts -maxdepth 2 | sort
          for split in eval full; do
            src="artifacts/tavernbench-oracle-$split"
            [ -d "$src" ] || { echo "no artifact for the $split split yet"; continue; }
            mkdir -p "results/$split"
            for f in "oracle-$split.png" "oracle-$split.svg"; do
              if [ -f "$src/$f" ]; then cp "$src/$f" "results/$split/"; fi
            done
            job="$src/jobs/tavernbench-oracle-$split"
            for f in result.json config.json; do
              if [ -f "$job/$f" ]; then cp "$job/$f" "results/$split/$f"; fi
            done
          done
          find results -type f | sort

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results
          if git diff --cached --quiet; then
            echo "nothing new to publish"
            exit 0
          fi
          git commit -m "Publish oracle results of run ${{ steps.run.outputs.id }}"
          git push
